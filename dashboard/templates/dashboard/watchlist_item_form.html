{% extends "dashboard/base.html" %}

{% block title %}
    <title>Добавить акцию в мониторинг</title>
{% endblock %}

{% block content %}
    <h1>Добавить акцию в мониторинг</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Добавить</button>
        <a class="btn btn-secondary" href="{% url 'dashboard:watchlist' %}">Отмена</a>
    </form>
{% endblock %}
