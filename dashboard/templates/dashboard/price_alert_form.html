{% extends "dashboard/base.html" %}

{% block title %}
    <title>Добавить целевую цену</title>
{% endblock %}

{% block content %}
    <h1>Целевая цена для {{ view.watchlist_item.share.ticker }}</h1>
    <p>Уведомление будет создано при пересечении заданной цены вверх или вниз.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Сохранить уровень</button>
        <a class="btn btn-secondary" href="{% url 'dashboard:watchlist' %}">Отмена</a>
    </form>
{% endblock %}
